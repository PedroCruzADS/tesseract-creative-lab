<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Inter;src:url('./node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2');font-weight:400}
@font-face{font-family:Inter;src:url('./node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2');font-weight:500}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080809;font-family:Inter,Arial,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#efeeeb;color:#101010}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0}
.paper{background:
 radial-gradient(1000px 1150px at 78% 46%,rgba(255,255,255,.72),rgba(255,255,255,0) 65%),
 linear-gradient(158deg,#fbfaf7 0%,#efeeea 56%,#ddd9d1 100%)}
.dark{background:radial-gradient(920px 820px at 50% 44%,#202023 0%,#0b0b0c 58%,#050506 100%);color:#fff}
.grain{position:absolute;inset:-20%;opacity:.012;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.76' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E");pointer-events:none}
.ambient{position:absolute;width:980px;height:1540px;left:-650px;top:150px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.98),rgba(255,255,255,.30) 43%,rgba(255,255,255,0) 75%);filter:blur(30px);opacity:.78}
.title{position:absolute;left:82px;top:145px;width:900px;font-size:86px;line-height:.94;letter-spacing:-.062em;font-weight:500;z-index:6}
.label{position:absolute;left:87px;top:350px;font-size:23px;line-height:1.2;letter-spacing:.075em;color:#555;font-weight:400;z-index:6}
.hero{position:absolute;left:-80px;top:420px;width:1240px;height:1110px;display:flex;align-items:center;justify-content:center;z-index:5;will-change:transform}
.scene2 .hero{left:-55px;top:420px;width:1190px;height:1110px}
.hero img{position:absolute;width:1210px;height:1010px;object-fit:contain;display:block}
.scene2 .hero img{width:1160px;height:1010px}
.base{filter:drop-shadow(0 54px 44px rgba(0,0,0,.12)) drop-shadow(0 18px 22px rgba(0,0,0,.10))}
.spec{filter:brightness(1.19) contrast(1.08) saturate(.94);opacity:0;mix-blend-mode:screen;
 -webkit-mask-image:linear-gradient(105deg,transparent 34%,rgba(0,0,0,.08) 42%,#000 49%,rgba(0,0,0,.28) 54%,transparent 63%);
 -webkit-mask-size:260% 100%;-webkit-mask-repeat:no-repeat;will-change:-webkit-mask-position,opacity}
.floorWide{position:absolute;left:110px;top:1370px;width:860px;height:86px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.19),rgba(0,0,0,.055) 42%,rgba(0,0,0,0) 74%);filter:blur(17px);opacity:.62;z-index:2}
.floorCore{position:absolute;left:250px;top:1383px;width:580px;height:34px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.23),rgba(0,0,0,.04) 70%);filter:blur(8px);opacity:.42;z-index:2}
.occlusion{position:absolute;top:-160px;left:-450px;width:650px;height:2290px;background:linear-gradient(90deg,#080809 0%,#111113 70%,rgba(17,17,19,0) 100%);transform:skewX(-6deg) translateX(-940px);z-index:25}
.close-silhouette{position:absolute;left:-70px;top:350px;width:1220px;height:980px;display:flex;align-items:center;justify-content:center;opacity:.05}
.close-silhouette img{max-width:1180px;max-height:900px;filter:brightness(0) invert(1);object-fit:contain}
.close-glow{position:absolute;width:760px;height:760px;border-radius:50%;filter:blur(110px);background:#fff;opacity:.035;left:160px;top:460px}
.close-logo{position:absolute;left:170px;top:635px;width:740px;height:150px;display:flex;align-items:center;justify-content:center}
.close-logo img{width:520px;height:auto;display:block;filter:brightness(0) invert(1)}
.close-copy{position:absolute;left:120px;top:872px;width:840px;text-align:center;font-size:58px;font-weight:400;letter-spacing:-.04em;line-height:1.05}
.close-meta{position:absolute;left:140px;top:1038px;width:800px;text-align:center;font-size:18px;letter-spacing:.17em;text-transform:uppercase;color:#a1a1a4}
</style></head><body><div id="stage">
<section id="s1" class="scene paper">
 <div id="a1" class="ambient"></div><div class="grain"></div>
 <div id="s1t" class="title">Cardio além<br>do físico.</div><div id="s1l" class="label">RUNVERSE</div>
 <div id="f1w" class="floorWide"></div><div id="f1c" class="floorCore"></div>
 <div id="s1h" class="hero"><img class="base" src="assets/runverse-cutout.png"><img id="sp1" class="spec" src="assets/runverse-cutout.png"></div>
</section>
<section id="s2" class="scene paper scene2">
 <div id="a2" class="ambient"></div><div class="grain"></div>
 <div id="s2t" class="title">Força com<br>controle absoluto.</div><div id="s2l" class="label">KONNECT · RESISTÊNCIA DIGITAL</div>
 <div id="f2w" class="floorWide"></div><div id="f2c" class="floorCore"></div>
 <div id="s2h" class="hero"><img class="base" src="assets/konnect-leg-press-cutout.png"><img id="sp2" class="spec" src="assets/konnect-leg-press-cutout.png"></div>
</section>
<section id="s3" class="scene dark">
 <div id="sil" class="close-silhouette"><img src="assets/runverse-cutout.png"></div><div id="cg" class="close-glow"></div><div class="grain"></div>
 <div id="logo" class="close-logo"><img src="assets/logo.svg"></div><div id="closeCopy" class="close-copy">Beyond the physical.</div><div id="closeMeta" class="close-meta">Performance · Design · Technology</div>
</section>
<div id="occ" class="occlusion"></div>
<script>
(()=>{const q=id=>document.getElementById(id),cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),out=v=>1-Math.pow(1-cl(v),4),io=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
const show=(el,on)=>el.style.opacity=on?'1':'0';const y=(id,n)=>q(id).style.transform='translateY('+n+'px)';
function material(id,p){const el=q(id),x=120-155*cl(p);el.style.webkitMaskPosition=x+'% 0%';el.style.opacity=String(.02+.28*Math.sin(Math.PI*cl(p)));}
function shadow(w,c,p,d){q(w).style.transform='translateX('+(d*11)+'px) scaleX('+(1.02+.035*Math.sin(Math.PI*p))+')';q(c).style.transform='translateX('+(d*16)+'px) scaleX('+(1+.025*Math.sin(Math.PI*p))+')';}
window.seek=t=>{
 show(q('s1'),t<2.62);show(q('s2'),t>=2.42&&t<5.02);show(q('s3'),t>=4.90);q('occ').style.transform='skewX(-6deg) translateX(-940px)';
 if(t<2.62){const p=out(t/.52),d=cl((t-.52)/1.90),mp=cl((t-.28)/1.72);
   q('s1h').style.opacity=String(cl(t/.18));q('s1h').style.transform='translateX('+(-20+38*d)+'px) translateY('+(42*(1-p)-18*d)+'px) scale('+(.98+.135*p+.022*d)+')';
   y('s1t',30*(1-out((t-.05)/.4)));q('s1t').style.opacity=String(cl((t-.02)/.22));y('s1l',14*(1-out((t-.22)/.34)));q('s1l').style.opacity=String(cl((t-.18)/.22));
   q('a1').style.transform='translateX('+(680*cl(t/2.45))+'px) scale('+(1+.08*cl(t/2.45))+')';material('sp1',mp);shadow('f1w','f1c',p,d);
   if(t>=2.34){const tr=io((t-2.34)/.34);q('s1h').style.transform+=' translateX('+(260*tr)+'px) scale('+(1+.045*tr)+')';q('occ').style.transform='skewX(-6deg) translateX('+(-940+1170*tr)+'px)';}
 }
 if(t>=2.42&&t<5.02){const lt=t-2.42,p=out(lt/.48),d=cl((lt-.48)/1.95),mp=cl((lt-.24)/1.78);
   q('s2h').style.opacity=String(cl((lt-.06)/.18));q('s2h').style.transform='translateX('+(-24+32*d)+'px) translateY('+(42*(1-p)-15*d)+'px) scale('+(.98+.13*p+.022*d)+')';
   y('s2t',28*(1-out((lt-.08)/.38)));q('s2t').style.opacity=String(cl((lt-.04)/.21));y('s2l',14*(1-out((lt-.22)/.34)));q('s2l').style.opacity=String(cl((lt-.18)/.21));
   q('a2').style.transform='translateX('+(700*cl(lt/2.45))+'px) scale('+(1+.08*cl(lt/2.45))+')';material('sp2',mp);shadow('f2w','f2c',p,d);
   if(lt<.42){const tr=1-io(lt/.42);q('occ').style.transform='skewX(-6deg) translateX('+(-940+1170*tr)+'px)';}
   if(lt>=2.28){const tr=io((lt-2.28)/.32);q('s2h').style.transform+=' translateX('+(268*tr)+'px) scale('+(1+.04*tr)+')';q('occ').style.transform='skewX(-6deg) translateX('+(-940+1170*tr)+'px)';}
 }
 if(t>=4.90){const lt=t-4.90,p=cl(lt/1.50),lp=out(lt/.42);q('sil').style.opacity=String(.03+.026*Math.sin(Math.PI*p));q('sil').style.transform='translateX('+(-32+54*p)+'px) translateY('+(-14*p)+'px) scale('+(1.02+.03*p)+')';q('cg').style.transform='translateX('+(145*p-72)+'px) scale('+(1+.12*p)+')';q('cg').style.opacity=String(.03+.05*Math.sin(Math.PI*Math.min(.94,p)));q('logo').style.opacity=String(cl(lt/.22));q('logo').style.transform='translateY('+(30*(1-lp)-4*p)+'px) scale('+(.968+.032*lp+.005*p)+')';q('closeCopy').style.opacity=String(cl((lt-.26)/.26));y('closeCopy',18*(1-out((lt-.26)/.35))-3*p);q('closeMeta').style.opacity=String(cl((lt-.62)/.26));}
};window.seek(0)})();
</script></div></body></html>
